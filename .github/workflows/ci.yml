name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro + Pagefind)
        run: npm run build

      - name: Check for broken internal links
        # Skip external URLs (flaky in CI) and optional owner-supplied audio assets.
        run: npx linkinator ".vercel/output/static" --recurse --skip "^https?://(?!localhost)|/assets/audio/"
